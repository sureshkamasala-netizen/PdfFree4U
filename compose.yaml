services:
  paperplane:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env file}
      DATABASE_PATH: /data/jobs.sqlite3
      OUTPUT_DIR: /data/outputs
    volumes:
      - paperplane-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  paperplane-data: